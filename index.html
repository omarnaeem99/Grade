 $("info").innerHTML=esc(pk(P.major))+"<br>"+esc(pk(P.college));
 $("ttl").textContent=t("title");$("gl").innerHTML=t("of")(P.scale.toFixed(2))+"<br>"+t("gl");
 $("t_done").textContent=t("tDone");$("t_left").textContent=t("tLeft");$("t_pct").textContent=t("tPct");$("pct2").textContent=t("pof")(P.plan);
 $("lang").textContent=t("langBtn");$("x").setAttribute("aria-label","Close");
 document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";document.title=t("title");lbl()}
const root=document.documentElement,dm=matchMedia("(prefers-color-scheme:dark)");
if(S.theme)root.dataset.theme=S.theme;
const isDark=()=>root.dataset.theme?root.dataset.theme=="dark":dm.matches;
function lbl(){$("theme").textContent=isDark()?t("light"):t("dark")}
function hero(R){const C=364.4,off=C*(1-R.pct/100);$("done").textContent=R.h;$("left").textContent=R.left;
 const set=(g,p)=>{$("gpa").textContent=g.toFixed(2);$("pct").textContent=p.toFixed(2)+"%"};
 if(reduce){set(R.gpa,R.pct);$("arc").style.strokeDashoffset=off;prev={g:R.gpa,p:R.pct};return}
 const o={...prev};gsap.killTweensOf(o);gsap.to(o,{g:R.gpa,p:R.pct,duration:first?2.2:.9,delay:first?.5:0,ease:"power2.out",onUpdate:()=>set(o.g,o.p),onComplete:()=>set(R.gpa,R.pct)});
 gsap.to("#arc",{strokeDashoffset:off,duration:first?2.2:.9,delay:first?.5:0,ease:"power2.out"});prev={g:R.gpa,p:R.pct}}
function card(c,tid){const ip=c.status=="ip",col=ip?"--gIP":gcol(c);
 return `<article class="card glass" data-t="${tid}" data-id="${c.id}" tabindex="0" role="button" style="--c:var(${col})"><div class="card-t"><div><h3>${esc(c.code)}</h3><div class="cn">${esc(nm(c))}</div></div><div class="badge">${ip?t("ip"):esc(c.grade)}</div></div><div class="meta"><span>${c.cr} ${t("hrs")}</span><span>${ip?(c.parts&&c.parts.mid?t("p").mid+" "+c.parts.mid[0]+" / "+c.parts.mid[1]:"In Progress"):(c.total!=null?c.total+" / 100":"")}</span></div>${ip?(c.parts&&c.parts.mid?`<div class="track"><div class="fill" data-w="${c.parts.mid[0]/c.parts.mid[1]*100}" style="width:${c.parts.mid[0]/c.parts.mid[1]*100}%"></div></div><div class="wait-t">${t("wait")}</div>`:`<div class="track wait"></div><div class="wait-t">${t("wait")}</div>`):`<div class="track"><div class="fill" data-w="${Math.min(c.total??gp(c)/S.profile.scale*100,100)}" style="width:${Math.min(c.total??gp(c)/S.profile.scale*100,100)}%"></div></div>`}</article>`}
function render(anim){
 ScrollTrigger.getAll().forEach(s=>s.kill());const R=calc();statics();hero(R);
 const gr=[...new Set(S.terms.flatMap(tm=>tm.courses.filter(c=>c.status=="done").map(c=>c.grade)))].sort((a,b)=>(SC[S.profile.scale].find(r=>r[0]==b)?.[2]||0)-(SC[S.profile.scale].find(r=>r[0]==a)?.[2]||0));
 const fl=["all",...gr,"ip"];if(!fl.includes(filter))filter="all";
 $("chips").innerHTML=fl.map(f=>`<button class="chip ${f==filter?"on":""}" data-f="${esc(f)}">${f=="all"?t("all"):f=="ip"?t("ip"):esc(f)}</button>`).join("");
 let h="";
 S.terms.forEach((tm,i)=>{const l=tm.courses.filter(c=>filter=="all"||(filter=="ip"?c.status=="ip":c.status=="done"&&c.grade==filter));
  if(!l.length&&filter!="all")return;
  const n=tm.courses.length,d=tm.courses.filter(c=>c.status=="done").length,st=!n?["pEmpty","--gIP"]:d==n?["pDone","--gA"]:d==0?["pIp","--gIP"]:["pMix","--gC"];
  const hr=tm.courses.reduce((a,c)=>a+c.cr,0),g=termGpa(tm);
  h+=`<section class="sem"><div class="sem-h"><h2>${esc(tn(tm,i))}<span class="pill" style="--p:var(${st[1]})">${t(st[0])}</span></h2><div class="acts"><span class="s">${hr} ${t("hrs")}${g!=null?" ، "+t("semGpa")+" "+g.toFixed(2):""}</span></div></div>${l.length?`<div class="grid">${l.map(c=>card(c,tm.id)).join("")}</div>`:`<div class="empty">${t("noC")}</div>`}</section>`});
 $("list").innerHTML=h||`<div class="empty">${S.terms.length?t("noF"):t("noT")}</div>`;
 if(reduce)return;
 document.querySelectorAll(".sem").forEach(sec=>{const cs=sec.querySelectorAll(".card"),fs=sec.querySelectorAll(".fill");
  if(anim)gsap.from(cs,{y:22,opacity:0,duration:.5,stagger:.06,ease:"power3.out",clearProps:"transform,opacity"});
  if(fs.length)gsap.fromTo(fs,{width:"0%"},{width:(i,el)=>el.dataset.w+"%",duration:1.2,stagger:.1,ease:"power3.out",scrollTrigger:{trigger:sec,start:"top 90%",once:true}})});
 ScrollTrigger.refresh()}

/* ===== النافذة المنبثقة ===== */
function showM(html,col){const ov=$("ov"),md=$("md");md.style.setProperty("--c",col||"var(--acc)");$("mb").innerHTML=html;
 if(curM){if(!reduce)gsap.from("#mb > *",{y:12,opacity:0,duration:.35,stagger:.04,clearProps:"transform,opacity"});return}
 curM=true;ov.style.display="flex";ov.setAttribute("aria-hidden","false");if(lenis)lenis.stop();$("x").focus({preventScroll:true});
 if(reduce)return;gsap.killTweensOf([ov,md]);
 gsap.fromTo(ov,{opacity:0},{opacity:1,duration:.25});gsap.fromTo(md,{opacity:0,scale:.9,y:26},{opacity:1,scale:1,y:0,duration:.5,ease:"power3.out"});
 gsap.from("#mb > *",{y:14,opacity:0,duration:.45,stagger:.05,delay:.12,clearProps:"transform,opacity"});
 gsap.fromTo("#mb .fill",{width:"0%"},{width:(i,el)=>el.dataset.w+"%",duration:1,stagger:.08,delay:.3,ease:"power3.out"})}
function closeM(){if(!curM)return;curM=null;const ov=$("ov"),md=$("md");
 const end=()=>{ov.style.display="none";ov.setAttribute("aria-hidden","true");if(lenis)lenis.start();if(lastF&&document.contains(lastF))lastF.focus({preventScroll:true})};
 if(reduce)return end();gsap.killTweensOf([ov,md]);gsap.to(md,{opacity:0,scale:.94,y:16,duration:.25,ease:"power2.in"});gsap.to(ov,{opacity:0,duration:.28,onComplete:end})}
const find=(tid,id)=>{const tm=S.terms.find(x=>x.id==tid);return[tm,tm&&tm.courses.find(c=>c.id==id)]};
function viewC(tid,id){const[tm,c]=find(tid,id),ip=c.status=="ip",col=ip?"--gIP":gcol(c);
 let h=`<span class="mcode">${esc(c.code)}</span><h2>${esc(nm(c))}</h2><div class="mm"><span>${c.cr} ${t("hrs")}</span><span class="badge" style="--c:var(${col})">${ip?t("ip"):esc(c.grade)}</span></div>`;
 if(ip){KEYS.forEach(k=>{const p=c.parts&&c.parts[k];if(p){const w=p[0]/p[1]*100;h+=`<div class="row"><div class="rt"><span>${t("p")[k]}</span><b>${p[0]} / ${p[1]}</b></div><div class="track"><div class="fill" data-w="${w}" style="width:${w}%"></div></div></div>`}});h+=`<div class="warn"><b>⚠</b><span>${c.parts?t("warn2"):t("warn")}</span></div>`+(c.parts?"":`<div class="track wait" style="margin-top:16px"></div>`)}
 else{KEYS.forEach(k=>{const p=c.parts&&c.parts[k];if(p){const w=p[0]/p[1]*100;h+=`<div class="row"><div class="rt"><span>${t("p")[k]}</span><b>${p[0]} / ${p[1]}</b></div><div class="track"><div class="fill" data-w="${w}" style="width:${w}%"></div></div></div>`}});
  if(c.total!=null)h+=`<div class="row tot"><div class="rt"><span>${t("p").tot}</span><b>${c.total} / 100</b></div><div class="track"><div class="fill" data-w="${Math.min(c.total,100)}" style="width:${Math.min(c.total,100)}%"></div></div></div>`}
 showM(h,`var(${col})`)}

/* ===== الأحداث ===== */
$("list").onclick=e=>{const c=e.target.closest(".card");if(c){lastF=c;viewC(c.dataset.t,c.dataset.id)}};
$("list").onkeydown=e=>{if(e.key!="Enter"&&e.key!=" ")return;const c=e.target.closest(".card");if(c){e.preventDefault();lastF=c;viewC(c.dataset.t,c.dataset.id)}};
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){filter=b.dataset.f;render(true)}};
$("theme").onclick=()=>{root.dataset.theme=isDark()?"light":"dark";S.theme=root.dataset.theme;save();lbl()};
$("lang").onclick=()=>{lang=lang=="ar"?"en":"ar";save();closeM();render(true)};
$("ov").onclick=e=>{if(e.target==$("ov"))closeM()};$("x").onclick=closeM;
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
$("hero").addEventListener("pointermove",e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty("--mx",(e.clientX-r.left)+"px");e.currentTarget.style.setProperty("--my",(e.clientY-r.top)+"px")});
if(window.Lenis){lenis=new Lenis({lerp:.075,smoothWheel:true});lenis.on("scroll",ScrollTrigger.update);gsap.ticker.add(tm=>lenis.raf(tm*1000));gsap.ticker.lagSmoothing(0)}

/* ===== تشغيل ===== */
render(false);
if(!reduce)gsap.timeline({defaults:{ease:"power3.out"}}).from(".topbar",{y:-20,opacity:0,duration:.6}).from(".hero",{y:40,opacity:0,scale:.97,duration:.9},"-=.3").from(".hero-txt > *",{y:22,opacity:0,duration:.7,stagger:.1},"-=.5").from(".bar",{y:16,opacity:0,duration:.5},"-=.3");
first=false;
</script>
</body>
</html>
