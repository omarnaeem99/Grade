<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السجل الأكاديمي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
:root{--bg:#eef1f8;--ink:#141a2e;--mute:#5d6683;--glass:rgba(255,255,255,.62);--line:rgba(20,26,46,.1);--acc:#5b6cff;--acc2:#18b894;--track:rgba(20,26,46,.09);
--gA:#14b88f;--gBp:#4f8cff;--gB:#7a6cff;--gIP:#8b93ad;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--ink:#eaeefc;--mute:#97a0c2;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#8a96ff;--acc2:#3fe0b5;--track:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#0b1020;--ink:#eaeefc;--mute:#97a0c2;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#8a96ff;--acc2:#3fe0b5;--track:rgba(255,255,255,.1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:var(--acc);top:-120px;right:-100px}
.b2{width:380px;height:380px;background:var(--acc2);bottom:-140px;left:-100px;opacity:.28}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:20px 16px 80px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.btn{font:inherit;color:var(--ink);cursor:pointer;border-radius:999px;padding:9px 18px;font-size:14px;transition:transform .25s,border-color .25s}
.btn:hover{transform:translateY(-2px);border-color:var(--acc)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{border-radius:32px;padding:30px 26px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,80%) var(--my,0%),color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%);pointer-events:none}
.hero-grid{display:grid;gap:26px;grid-template-columns:1fr;position:relative}
@media(min-width:800px){.hero-grid{grid-template-columns:1.2fr 1fr;align-items:center}}
.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;margin-bottom:16px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px;font-weight:700;line-height:1.3}
.sub{color:var(--mute);font-size:15px;line-height:1.9;margin:0}
.gpa-row{display:flex;align-items:baseline;gap:10px;margin-top:22px}
.gpa-n{font-size:clamp(54px,11vw,76px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.gpa-l{color:var(--mute);font-size:14px;line-height:1.6}
.panel{border-radius:24px;padding:22px;background:var(--glass);border:1px solid var(--line);display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring,.ring svg,.ring svg *,.ring .num{outline:none!important;border:0!important;box-shadow:none!important;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.stats{display:grid;gap:12px;font-size:13px;color:var(--mute)}
.stats b{color:var(--ink);font-size:19px;margin-inline-end:6px;font-variant-numeric:tabular-nums}
.bar{margin:34px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;transition:all .25s}
.chip:hover{color:var(--ink);border-color:var(--acc);transform:translateY(-2px)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sem{margin-top:30px}
.sem-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.sem-h h2{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.sem-h span.s{font-size:13px;color:var(--mute)}
.pill{font-size:12px;font-weight:500;padding:4px 12px;border-radius:99px;color:var(--p);background:color-mix(in srgb,var(--p) 16%,transparent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{border-radius:22px;padding:18px;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px) scale(1.015);border-color:var(--c);box-shadow:0 18px 40px -18px var(--c)}
.card-t{display:flex;justify-content:space-between;gap:10px;align-items:center}
.card h3{margin:0;font-size:19px;font-weight:600;direction:ltr;letter-spacing:.5px}
.badge{min-width:46px;text-align:center;font-weight:700;font-size:15px;padding:6px 10px;border-radius:12px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);direction:ltr}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:16px 0 8px}
.track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--c)}
.wait{background:repeating-linear-gradient(135deg,var(--track) 0 8px,transparent 8px 16px);opacity:.9}
.wait-t{font-size:12px;color:var(--mute);margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.card{cursor:pointer}.card:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.cn{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.5}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(4,7,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.md{--c:var(--acc);width:min(500px,100%);max-height:86vh;overflow:auto;border-radius:28px;padding:26px 24px;position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.md.glass{background:color-mix(in srgb,var(--bg) 78%,transparent)}
.x{position:absolute;top:14px;inset-inline-end:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;font-size:15px;transition:transform .25s,border-color .25s}
.x:hover{transform:rotate(90deg);border-color:var(--acc)}.x:focus-visible{outline:2px solid var(--acc)}
.mcode{unicode-bidi:isolate;direction:ltr;display:inline-block;font-size:13px;color:var(--mute);letter-spacing:.5px}
.md h2{margin:4px 0 0;font-size:22px;line-height:1.45;font-weight:700;padding-inline-end:44px}
.mm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 6px;font-size:14px;color:var(--mute)}
.row{margin-top:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line)}
.row.tot{background:color-mix(in srgb,var(--c) 14%,transparent);border-color:var(--c)}
.rt{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.rt b{direction:ltr;font-variant-numeric:tabular-nums}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--gIP) 16%,transparent);border:1px solid var(--gIP);font-size:14px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
  <div class="topbar">
    <strong id="ttl" style="font-size:15px;color:var(--mute)"></strong>
    <div style="display:flex;gap:8px"><button class="btn glass" id="lang" aria-label="Language"></button><button class="btn glass" id="theme" aria-label="Theme"></button></div>
  </div>

  <section class="hero glass" id="hero">
    <div class="hero-grid">
      <div class="hero-txt">
        <div class="avatar" id="av"></div>
        <h1 id="name"></h1>
        <p class="sub" id="info"></p>
        <div class="gpa-row"><div class="gpa-n" id="gpa">0.00</div><div class="gpa-l" id="gl"></div></div>
      </div>
      <div class="panel hero-txt">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="58" fill="none" stroke="var(--track)" stroke-width="9"/>
            <circle id="arc" cx="66" cy="66" r="58" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="364.4"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b6cff"/><stop offset="1" stop-color="#18b894"/></linearGradient></defs>
          </svg>
          <div class="num" id="pct">0%</div>
        </div>
        <div class="stats">
          <div><b id="done">0</b><span id="t_done"></span></div>
          <div><b id="left">0</b><span id="t_left"></span></div>
          <div style="color:var(--mute)"><span id="t_pct"></span> <span id="pct2"></span></div>
        </div>
      </div>
    </div>
  </section>

  <div class="bar"><div class="chips" id="chips"></div></div>
  <div id="list"></div>
</main>
<div id="ov" class="ov" aria-hidden="true"><div id="md" class="md glass" role="dialog" aria-modal="true" data-lenis-prevent><button id="x" class="x" type="button">✕</button><div id="mb"></div></div></div>

<script>
/* ===== بياناتك ===== */
const STUDENT={name:{ar:"عمر نعيم",en:"Omar Naeem"},major:{ar:"الحوسبة مع الأعمال (Computing with Business)",en:"Computing with Business"},college:{ar:"كلية دراسات الحاسب الآلي",en:"College of Computing Studies"}};
const PLAN={total:131,done:16,left:115,pct:12.21,gpa:3.47};
const SEMS=[
 {t:["الفصل الأول","Term 1"],status:"done",c:[
  ["GR101","A",3,90,{ar:"مهارات التعلم الذاتي",en:"Self-Learning Skills"},[["tma",18,20],["mid",28,30],["fin",44,50],["tot",90,100]]],
  ["EL111","B+",3,87.75,{ar:"مهارات الاتصال في اللغة الإنجليزية 1",en:"English Communication Skills 1"},[["att",9.75,10],["tma",9,10],["mid",28,30],["fin",41,50],["tot",87.75,100]]],
  ["AR111","B+",3,83,{ar:"مهارات الاتصال في اللغة العربية 1",en:"Arabic Communication Skills 1"},[["att",10,10],["tma",10,10],["mid",25,30],["fin",38,50],["tot",83,100]]],
  ["TU170","B+",3,83,{ar:"أساسيات الحوسبة",en:"Computing Fundamentals"},[["att",10,10],["tma",10,10],["mid",22,30],["fin",41,50],["tot",83,100]]],
  ["MT129","B",4,78,{ar:"حساب التفاضل والتكامل والاحتمال",en:"Calculus and Probability"},[["att",10,10],["tma",10,10],["mid",17,30],["fin",41,50],["tot",78,100]]]
 ]},
 {t:["الفصل الثاني","Term 2"],status:"ip",c:[
  ["AR112",null,3,null,{ar:"مهارات الاتصال في اللغة العربية 2",en:"Arabic Communication Skills 2"}],
  ["EL112",null,3,null,{ar:"مهارات الاتصال في اللغة الإنجليزية 2",en:"English Communication Skills 2"}],
  ["GR111",null,3,null,{ar:"الدراسات الإسلامية",en:"Islamic Studies"}],
  ["MT131",null,4,null,{ar:"الرياضيات المنفصلة",en:"Discrete Mathematics"}],
  ["TM105",null,4,null,{ar:"مقدمة في البرمجة",en:"Introduction to Programming"}]
 ]}
];
/* ================== */
const COL={"A":"--gA","B+":"--gBp","B":"--gB"};
const T={
ar:{title:"السجل الأكاديمي",gpaLbl:"من 4.00<br>المعدل التراكمي",tDone:"ساعة مكتملة",tLeft:"ساعة متبقية",tPct:"نسبة إتمام الخطة",of:n=>"(من "+n+" ساعة)",f:{all:"الكل",A:"A","B+":"B+",B:"B",ip:"قيد الدراسة"},hrs:"ساعات",semGpa:"معدل الفصل",pillIp:"قيد الدراسة / In Progress",pillDone:"مكتمل / Completed",ip:"قيد الدراسة",cur:"جارية",wait:"بانتظار الدرجة النهائية",empty:"لا توجد مواد لهذا الفلتر. اختر \"الكل\" لعرض جميع المواد.",dark:"الوضع الداكن",light:"الوضع الفاتح",langBtn:"English",close:"إغلاق",warn:"المقرر قيد الدراسة حالياً - لم يتم رصد درجات الاختبارات بعد",p:{att:"الحضور والمشاركة",tma:"الواجب (TMA)",mid:"الاختبار النصفي",fin:"الاختبار النهائي",tot:"المجموع النهائي"}},
en:{title:"Academic Transcript",gpaLbl:"out of 4.00<br>Cumulative GPA",tDone:"credit hours completed",tLeft:"credit hours remaining",tPct:"Plan completion",of:n=>"(of "+n+" hours)",f:{all:"All",A:"A","B+":"B+",B:"B",ip:"In Progress"},hrs:"hours",semGpa:"Term GPA",pillIp:"In Progress",pillDone:"Completed",ip:"In Progress",cur:"Ongoing",wait:"Awaiting final grade",empty:"No courses match this filter. Choose \"All\" to see every course.",dark:"Dark mode",light:"Light mode",langBtn:"العربية",close:"Close",warn:"This course is currently in progress - exam grades have not been recorded yet",p:{att:"Attendance & Participation",tma:"Assignment (TMA)",mid:"Midterm Exam",fin:"Final Exam",tot:"Final Total"}}};
let lang="ar";
const L=new Proxy({},{get:(_,k)=>T[lang][k]});
const FILTERS=["all","A","B+","B","ip"];
const $=id=>document.getElementById(id);
let filter="all",lenis=null;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
gsap.registerPlugin(ScrollTrigger);

function statics(){const S=STUDENT;$("name").textContent=S.name[lang];$("av").textContent=S.name[lang].trim()[0];
$("info").innerHTML=S.major[lang]+"<br>"+S.college[lang];
$("done").textContent=PLAN.done;$("left").textContent=PLAN.left;$("pct2").textContent=L.of(PLAN.total);$("ttl").textContent=L.title;$("gl").innerHTML=L.gpaLbl;$("t_done").textContent=L.tDone;$("t_left").textContent=L.tLeft;$("t_pct").textContent=L.tPct;$("lang").textContent=L.langBtn;document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";document.title=L.title}
statics();

function chips(){$("chips").innerHTML=FILTERS.map(f=>`<button class="chip ${f==filter?"on":""}" data-f="${f}">${L.f[f]}</button>`).join("")}

function card(c,ip){
  if(ip)return `<article class="card glass" data-code="${c[0]}" tabindex="0" role="button" style="--c:var(--gIP)"><div class="card-t"><div><h3>${c[0]}</h3><div class="cn">${c[4][lang]}</div></div><div class="badge">${L.ip}</div></div><div class="meta"><span>${c[2]} ${L.hrs}</span><span>${L.cur}</span></div><div class="track wait"></div><div class="wait-t">${L.wait}</div></article>`;
  return `<article class="card glass" data-code="${c[0]}" tabindex="0" role="button" style="--c:var(${COL[c[1]]})"><div class="card-t"><div><h3>${c[0]}</h3><div class="cn">${c[4][lang]}</div></div><div class="badge">${c[1]}</div></div><div class="meta"><span>${c[2]} ${L.hrs}</span><span>${c[3]} / 100</span></div><div class="track"><div class="fill" data-w="${c[3]}" style="width:${c[3]}%"></div></div></article>`;
}

function render(animate){
  ScrollTrigger.getAll().forEach(t=>t.kill());
  let h="";
  SEMS.forEach(s=>{
    const ip=s.status=="ip";
    const l=s.c.filter(c=>filter=="all"||(filter=="ip"?ip:(!ip&&c[1]==filter)));
    if(!l.length)return;
    const hrs=s.c.reduce((a,c)=>a+c[2],0);
    h+=`<section class="sem"><div class="sem-h"><h2>${s.t[lang=="ar"?0:1]}<span class="pill" style="--p:var(${ip?"--gIP":"--gA"})">${ip?L.pillIp:L.pillDone}</span></h2><span class="s">${hrs} ${L.hrs}${ip?"":" ، "+L.semGpa+" "+PLAN.gpa.toFixed(2)}</span></div><div class="grid">${l.map(c=>card(c,ip)).join("")}</div></section>`;
  });
  $("list").innerHTML=h||`<div class="empty">${L.empty}</div>`;
  if(reduce)return;
  document.querySelectorAll(".sem").forEach(sec=>{
    const cards=sec.querySelectorAll(".card"),fills=sec.querySelectorAll(".fill");
    if(animate)gsap.from(cards,{y:22,opacity:0,duration:.5,stagger:.06,ease:"power3.out",clearProps:"transform,opacity"});
    if(fills.length)gsap.fromTo(fills,{width:"0%"},{width:(i,el)=>el.dataset.w+"%",duration:1.2,stagger:.1,ease:"power3.out",
      scrollTrigger:{trigger:sec,start:"top 90%",once:true}});
  });
  ScrollTrigger.refresh();
}
chips();render(false);
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;chips();render(true)};

/* الوضع الداكن */
const root=document.documentElement,dm=matchMedia("(prefers-color-scheme:dark)");
const isDark=()=>root.dataset.theme?root.dataset.theme=="dark":dm.matches;
const lbl=()=>$("theme").textContent=isDark()?L.light:L.dark;
$("theme").onclick=()=>{root.dataset.theme=isDark()?"light":"dark";lbl()};lbl();
$("lang").onclick=()=>{lang=lang=="ar"?"en":"ar";statics();chips();render(true);lbl();if(curM){buildM(curM);$("x").setAttribute("aria-label",L.close)}};

/* النافذة المنبثقة */
let curM=null,lastF=null;
const byCode=code=>{for(const s of SEMS){const c=s.c.find(x=>x[0]==code);if(c)return [c,s.status=="ip"]}};
function buildM(code){
  const [c,ip]=byCode(code);
  let h=`<div><span class="mcode">${c[0]}</span><h2>${c[4][lang]}</h2><div class="mm"><span>${c[2]} ${L.hrs}</span><span class="badge">${ip?L.ip:c[1]}</span></div></div>`;
  if(ip)h+=`<div class="warn"><b>⚠</b><span>${L.warn}</span></div><div class="track wait" style="margin-top:16px"></div>`;
  else h+=c[5].map(p=>{const w=p[1]/p[2]*100;return `<div class="row ${p[0]=="tot"?"tot":""}"><div class="rt"><span>${L.p[p[0]]}</span><b>${p[1]} / ${p[2]}</b></div><div class="track"><div class="fill" data-w="${w}" style="width:${w}%"></div></div></div>`}).join("");
  $("mb").innerHTML=h;
}
function openM(code,from){
  curM=code;lastF=from;const [c,ip]=byCode(code),ov=$("ov"),md=$("md");
  md.style.setProperty("--c",ip?"var(--gIP)":`var(${COL[c[1]]})`);
  buildM(code);$("x").setAttribute("aria-label",L.close);
  ov.style.display="flex";ov.setAttribute("aria-hidden","false");if(lenis)lenis.stop();
  $("x").focus({preventScroll:true});
  if(reduce)return;
  gsap.killTweensOf([ov,md]);
  gsap.fromTo(ov,{opacity:0},{opacity:1,duration:.25});
  gsap.fromTo(md,{opacity:0,scale:.9,y:26},{opacity:1,scale:1,y:0,duration:.5,ease:"power3.out"});
  gsap.from("#mb > *",{y:14,opacity:0,duration:.45,stagger:.06,delay:.15,ease:"power2.out",clearProps:"transform,opacity"});
  gsap.fromTo("#mb .fill",{width:"0%"},{width:(i,el)=>el.dataset.w+"%",duration:1,stagger:.08,delay:.3,ease:"power3.out"});
}
function closeM(){
  if(!curM)return;curM=null;const ov=$("ov"),md=$("md");
  const end=()=>{ov.style.display="none";ov.setAttribute("aria-hidden","true");if(lenis)lenis.start();if(lastF)lastF.focus({preventScroll:true})};
  if(reduce)return end();
  gsap.killTweensOf([ov,md]);
  gsap.to(md,{opacity:0,scale:.94,y:16,duration:.25,ease:"power2.in"});
  gsap.to(ov,{opacity:0,duration:.28,onComplete:end});
}
$("list").onclick=e=>{const a=e.target.closest(".card");if(a)openM(a.dataset.code,a)};
$("list").onkeydown=e=>{if(e.key!="Enter"&&e.key!=" ")return;const a=e.target.closest(".card");if(a){e.preventDefault();openM(a.dataset.code,a)}};
$("ov").onclick=e=>{if(e.target==$("ov"))closeM()};
$("x").onclick=closeM;
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});

/* Lenis */
if(window.Lenis){lenis=new Lenis({lerp:.075,smoothWheel:true});
  lenis.on("scroll",ScrollTrigger.update);
  gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0)}

/* حركة التحميل والعدّادات */
const C=364.4,off=C*(1-PLAN.pct/100);
if(!reduce){
  gsap.timeline({defaults:{ease:"power3.out"}})
    .from(".topbar",{y:-20,opacity:0,duration:.6})
    .from(".hero",{y:40,opacity:0,scale:.97,duration:.9},"-=.3")
    .from(".hero-txt > *",{y:22,opacity:0,duration:.7,stagger:.1},"-=.5")
    .from(".bar",{y:16,opacity:0,duration:.5},"-=.3");
  const o={g:0,p:0};
  gsap.to(o,{g:PLAN.gpa,p:PLAN.pct,duration:2.2,delay:.5,ease:"power2.out",
    onUpdate:()=>{$("gpa").textContent=o.g.toFixed(2);$("pct").textContent=o.p.toFixed(2)+"%"},
    onComplete:()=>{$("gpa").textContent=PLAN.gpa.toFixed(2);$("pct").textContent=PLAN.pct.toFixed(2)+"%"}});
  gsap.to("#arc",{strokeDashoffset:off,duration:2.2,delay:.5,ease:"power2.out"});
}else{$("gpa").textContent=PLAN.gpa.toFixed(2);$("pct").textContent=PLAN.pct.toFixed(2)+"%";$("arc").style.strokeDashoffset=off}

$("hero").addEventListener("pointermove",e=>{const r=e.currentTarget.getBoundingClientRect();
  e.currentTarget.style.setProperty("--mx",(e.clientX-r.left)+"px");e.currentTarget.style.setProperty("--my",(e.clientY-r.top)+"px")});
</script>
</body>
</html>
