<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academic Transcript</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
:root{--bg:#eef1f8;--ink:#141a2e;--mute:#5d6683;--glass:rgba(255,255,255,.62);--line:rgba(20,26,46,.12);--acc:#5b6cff;--acc2:#18b894;--track:rgba(20,26,46,.08);--gA:#14b88f;--gBp:#4f8cff;--gB:#7a6cff;--gC:#e8a23a;--gF:#ef5b6b;--gIP:#8b93ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--ink:#eaeefc;--mute:#97a0c2;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#8a96ff;--acc2:#3fe0b5;--track:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#0b1020;--ink:#eaeefc;--mute:#97a0c2;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#8a96ff;--acc2:#3fe0b5;--track:rgba(255,255,255,.1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none}.b1{width:420px;height:420px;background:var(--acc);top:-120px;right:-100px}.b2{width:380px;height:380px;background:var(--acc2);bottom:-140px;left:-100px;opacity:.28}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:20px 16px 70px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px;flex-wrap:wrap}.tb{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;color:var(--ink);cursor:pointer;border-radius:999px;padding:8px 16px;font-size:14px;border:1px solid var(--line);background:var(--glass);transition:all .25s cubic-bezier(.4,0,.2,1)}
.btn:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 8px 22px -8px color-mix(in srgb,var(--acc) 55%,transparent)}
.btn:active{transform:scale(.97)}.btn.sm{padding:5px 12px;font-size:13px}
button:focus-visible,.card:focus-visible{outline:none!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent)!important}
.hero{border-radius:32px;padding:30px 26px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,80%) var(--my,0%),color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%);pointer-events:none}
.hero-grid{display:grid;gap:26px;grid-template-columns:1fr;position:relative}@media(min-width:800px){.hero-grid{grid-template-columns:1.2fr 1fr;align-items:center}}
.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;margin-bottom:16px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px;font-weight:700;line-height:1.3;word-break:break-word}.sub{color:var(--mute);font-size:15px;line-height:1.9;margin:0}
.gpa-row{display:flex;align-items:baseline;gap:10px;margin-top:22px}.gpa-n{font-size:clamp(54px,11vw,76px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}.gpa-l{color:var(--mute);font-size:14px;line-height:1.6}
.panel{border-radius:24px;padding:22px;background:var(--glass);border:1px solid var(--line);display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}.ring svg{transform:rotate(-90deg);display:block}
.ring,.ring svg,.ring svg *,.ring .num{outline:none!important;border:0!important;-webkit-tap-highlight-color:transparent;user-select:none}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.stats{display:grid;gap:12px;font-size:13px;color:var(--mute)}.stats b{color:var(--ink);font-size:19px;margin-inline-end:6px;font-variant-numeric:tabular-nums}
.bar{margin:34px 0 4px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);direction:ltr}
.chip:hover{color:var(--ink);border-color:var(--acc);transform:translateY(-2px);box-shadow:0 8px 22px -8px color-mix(in srgb,var(--acc) 55%,transparent)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:active{transform:scale(.97)}
.sem{margin-top:30px}.sem-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.sem-h h2{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sem-h .s{font-size:13px;color:var(--mute)}
.pill{font-size:12px;font-weight:500;padding:4px 12px;border-radius:99px;color:var(--p);background:color-mix(in srgb,var(--p) 16%,transparent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{border-radius:22px;padding:18px;background:var(--glass);border:1px solid var(--line);transition:transform .25s cubic-bezier(.4,0,.2,1),border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 12px 30px -15px var(--c)}
.card-t{display:flex;justify-content:space-between;gap:10px;align-items:center}.card h3{margin:0;font-size:19px;font-weight:600;direction:ltr;letter-spacing:.5px;text-align:start}.cn{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.5}
.badge{min-width:46px;text-align:center;font-weight:700;font-size:15px;padding:6px 10px;border-radius:12px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);direction:ltr}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:16px 0 8px}
.track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--c)}
.mid-info{font-size:13px;color:var(--acc2);margin-top:10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--acc2) 12%,transparent);padding:6px 10px;border-radius:10px}
.wait-t{font-size:12px;color:var(--mute);margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:34px 0}
*{-webkit-tap-highlight-color:transparent}
button,.btn,.chip,.card,[role="button"],select,input{outline:none!important}
button,.btn,.chip,.card,[role="button"]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
  <div class="topbar"><strong id="ttl" style="font-size:15px;color:var(--mute)"></strong>
    <div class="tb"><button class="btn glass" id="lang"></button><button class="btn glass" id="theme"></button></div></div>
  <section class="hero glass" id="hero"><div class="hero-grid">
    <div class="hero-txt"><div class="avatar" id="av"></div><h1 id="name"></h1><p class="sub" id="info"></p>
      <div class="gpa-row"><div class="gpa-n" id="gpa">0.00</div><div class="gpa-l" id="gl"></div></div></div>
    <div class="panel hero-txt"><div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="58" fill="none" stroke="var(--track)" stroke-width="9"/><circle id="arc" cx="66" cy="66" r="58" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="364.4"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b6cff"/><stop offset="1" stop-color="#18b894"/></linearGradient></defs></svg><div class="num" id="pct">0%</div></div>
      <div class="stats"><div><b id="done">0</b><span id="t_done"></span></div><div><b id="left">0</b><span id="t_left"></span></div><div style="color:var(--mute)"><span id="t_pct"></span> <span id="pct2"></span></div></div></div>
  </div></section>
  <div class="bar"><div class="chips" id="chips"></div></div>
  <div id="list"></div>
</main>
<script>
const T={
ar:{title:"السجل الأكاديمي",dark:"الوضع الداكن",light:"الوضع الفاتح",langBtn:"English",of:s=>"من "+s,gl:"المعدل التراكمي",tDone:"ساعة مكتملة",tLeft:"ساعة متبقية",tPct:"نسبة إتمام الخطة",pof:n=>"(من "+n+" ساعة)",all:"الكل",ip:"قيد الدراسة",hrs:"ساعات",semGpa:"معدل الفصل",pDone:"مكتمل",pIp:"قيد الدراسة",pMix:"جزئي",pEmpty:"فارغ",wait:"بانتظار الدرجة النهائية",p:{tot:"المجموع النهائي"},term:"الفصل",noC:"لا توجد مواد في هذا الفصل بعد.",noF:"لا توجد مواد لهذا الفلتر."},
en:{title:"Academic Transcript",dark:"Dark mode",light:"Light mode",langBtn:"العربية",of:s=>"out of "+s,gl:"Cumulative GPA",tDone:"credit hours completed",tLeft:"credit hours remaining",tPct:"Plan completion",pof:n=>"(of "+n+" hours)",all:"All",ip:"In Progress",hrs:"hours",semGpa:"Term GPA",pDone:"Completed",pIp:"In Progress",pMix:"Partial",pEmpty:"Empty",wait:"Awaiting final grade",p:{tot:"Final Total"},term:"Term",noC:"No courses in this term yet.",noF:"No courses match this filter."}};

const SC={4:[["A",90,4],["B+",80,3.5],["B",70,3],["C+",65,2.5],["C",60,2],["D+",55,1.5],["D",50,1],["F",0,0]]};
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

const D=(code,ar,en,cr,parts)=>{const total=Object.values(parts).reduce((a,p)=>a+p[0],0);return{id:uid(),code,ar,en,cr,status:"done",parts,total,grade:SC[4].find(r=>total>=r[1])[0]}};
const IP=(code,ar,en,cr,mid)=>({id:uid(),code,ar,en,cr,status:"ip",mid:mid});

function sample(){return{profile:{name:{ar:"عمر نعيم",en:"Omar Naeem"},major:{ar:"الحوسبة مع الأعمال",en:"Computing with Business"},college:{ar:"كلية دراسات الحاسب الآلي",en:"College of Computing Studies"},scale:4,plan:131},terms:[
{id:uid(),name:"",courses:[
D("GR101","مهارات التعلم الذاتي","Self-Learning Skills",3,{tma:[18,20],mid:[28,30],fin:[44,50]}),
D("EL111","مهارات الاتصال في اللغة الإنجليزية 1","English Communication Skills 1",3,{att:[9.75,10],tma:[9,10],mid:[28,30],fin:[41,50]}),
D("AR111","مهارات الاتصال في اللغة العربية 1","Arabic Communication Skills 1",3,{att:[10,10],tma:[10,10],mid:[25,30],fin:[38,50]}),
D("TU170","أساسيات الحوسبة","Computing Fundamentals",3,{att:[10,10],tma:[10,10],mid:[22,30],fin:[41,50]}),
D("MT129","حساب التفاضل والتكامل والاحتمال","Calculus and Probability",4,{att:[10,10],tma:[10,10],mid:[17,30],fin:[41,50]})]},
{id:uid(),name:"",courses:[
IP("AR112","مهارات الاتصال في اللغة العربية 2","Arabic Communication Skills 2",3,21),
IP("EL112","مهارات الاتصال في اللغة الإنجليزية 2","English Communication Skills 2",3,25.5),
IP("GR111","الدراسات الإسلامية","Islamic Studies",3,29),
IP("MT131","الرياضيات المنفصلة","Discrete Mathematics",4,null),
IP("TM105","مقدمة في البرمجة","Introduction to Programming",4,27)
]}],theme:"",lang:"ar"}}

let S=sample(),lang="ar",filter="all",prev={g:0,p:0},first=true;
const t=k=>T[lang][k],nm=c=>lang=="ar"?(c.ar||c.en):(c.en||c.ar),tn=(tm,i)=>tm.name||t("term")+" "+(i+1);
const gp=c=>{const r=SC[4].find(r=>r[0]==c.grade);return r?r[2]:0};
const gcol=c=>{const r=gp(c)/4;return r>=.95?"--gA":r>=.85?"--gBp":r>=.7?"--gB":r>=.4?"--gC":"--gF"};

function calc(){let pts=0,h=0;S.terms.forEach(tm=>tm.courses.forEach(c=>{if(c.status=="done"){h+=c.cr;pts+=c.cr*gp(c)}}));const pl=S.profile.plan;return{gpa:h?pts/h:0,h,left:Math.max(pl-h,0),pct:pl?Math.min(h/pl*100,100):0}}
function termGpa(tm){let p=0,h=0;tm.courses.forEach(c=>{if(c.status=="done"){h+=c.cr;p+=c.cr*gp(c)}});return h?p/h:null}
gsap.registerPlugin(ScrollTrigger);

function statics(){const P=S.profile,pk=o=>o[lang]||o.ar,n=pk(P.name);$("name").textContent=n;$("av").textContent=n.trim()[0]||"?";
 $("info").innerHTML=esc(pk(P.major))+"<br>"+esc(pk(P.college));
 $("ttl").textContent=t("title");$("gl").innerHTML=t("of")(P.scale.toFixed(2))+"<br>"+t("gl");
 $("t_done").textContent=t("tDone");$("t_left").textContent=t("tLeft");$("t_pct").textContent=t("tPct");$("pct2").textContent=t("pof")(P.plan);
 $("lang").textContent=t("langBtn");
 document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";document.title=t("title");lbl()}

const root=document.documentElement,dm=matchMedia("(prefers-color-scheme:dark)");
if(S.theme)root.dataset.theme=S.theme;
const isDark=()=>root.dataset.theme?root.dataset.theme=="dark":dm.matches;
function lbl(){$("theme").textContent=isDark()?t("light"):t("dark")}

function hero(R){const C=364.4,off=C*(1-R.pct/100);$("done").textContent=R.h;$("left").textContent=R.left;
 const set=(g,p)=>{$("gpa").textContent=g.toFixed(2);$("pct").textContent=p.toFixed(2)+"%"};
 if(reduce){set(R.gpa,R.pct);$("arc").style.strokeDashoffset=off;prev={g:R.gpa,p:R.pct};return}
 const o={...prev};gsap.killTweensOf(o);gsap.to(o,{g:R.gpa,p:R.pct,duration:first?2.2:.9,ease:"power3.out",onUpdate:()=>set(o.g,o.p)});
 gsap.to("#arc",{strokeDashoffset:off,duration:first?2.4:1,ease:"power3.out"});
 prev={g:R.gpa,p:R.pct};first=false}

function chips(){const list=[{id:"all",l:t("all")},{id:"ip",l:t("ip")}];
 S.terms.forEach((tm,i)=>{list.push({id:tm.id,l:tn(tm,i)})});
 $("chips").innerHTML=list.map(c=>`<button class="chip ${filter==c.id?"on":""}" data-f="${c.id}">${esc(c.l)}</button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>filterTerm(b.dataset.f))}
function filterTerm(id){filter=id;chips();renderList()}

function renderList(){
  const f=filter;let html="";
  S.terms.forEach((tm,i)=>{
    const courses=tm.courses.filter(c=>{if(f=="all")return true;if(f=="ip")return c.status=="ip";return tm.id==f});
    if(f!="all"&&f!="ip"&&tm.id!=f)return;
    const tg=termGpa(tm),tDone=tm.courses.filter(c=>c.status=="done").length,tIp=tm.courses.filter(c=>c.status=="ip").length;
    let badgeText="",badgeColor="--mute";
    if(tDone==tm.courses.length&&tm.courses.length>0){badgeText=t("pDone");badgeColor="--gA"}
    else if(tIp==tm.courses.length&&tm.courses.length>0){badgeText=t("pIp");badgeColor="--gIP"}
    else if(tDone>0){badgeText=t("pMix");badgeColor="--gBp"}
    else{badgeText=t("pEmpty");badgeColor="--mute"}
    
    html+=`<div class="sem" data-id="${tm.id}"><div class="sem-h"><h2>${esc(tn(tm,i))} <span class="pill" style="--p:var(${badgeColor})">${badgeText}</span></h2>
    <div class="acts"><span class="s">${tg!=null?t("semGpa")+": <b>"+tg.toFixed(2)+"</b>":""}</span></div></div>`;
    
    if(courses.length==0){html+=`<div class="empty glass">${t("noC")}</div></div>`;return}
    html+=`<div class="grid">`;
    courses.forEach(c=>{
      const col=c.status=="done"?gcol(c):"--gIP";
      html+=`<div class="card glass" style="--c:var(${col})">
      <div class="card-t"><div><h3>${esc(c.code)}</h3><div class="cn">${esc(nm(c))}</div></div>
      <div class="badge" style="--c:var(${col})">${c.status=="done"?c.grade:t("ip")}</div></div>`;
      if(c.status=="done"){
        const pct=c.total||0;
        html+=`<div class="meta"><span>${t("p.tot")}</span><b>${pct.toFixed(1)}%</b></div><div class="track"><div class="fill" style="width:${pct}%;--c:var(${col})"></div></div>`;
      }else{
        if(c.mid!=null){
          html+=`<div class="mid-info"><span>الاختبار النصفي (Midterm)</span><b>${c.mid} / 30</b></div>`;
        }
        html+=`<div class="wait-t">⏳ ${t("wait")}</div>`;
      }
      html+=`</div>`;
    });
    html+=`</div></div>`;
  });
  if(!html)html=`<div class="empty glass">${t("noF")}</div>`;
  $("list").innerHTML=html;
}

function render(){statics();hero(calc());chips();renderList()}

$("lang").onclick=()=>{lang=lang=="ar"?"en":"ar";render();statics()};
$("theme").onclick=()=>{
  const d=isDark();root.dataset.theme=d?"light":"dark";S.theme=root.dataset.theme;lbl();
};

window.onload=()=>{
  statics();render();
  lenis=new Lenis({duration:1.2,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
  function raf(t){lenis.raf(t);requestAnimationFrame(raf)}
  requestAnimationFrame(raf);
};
</script>
</body>
</html>
