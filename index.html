const root=document.documentElement,dm=matchMedia("(prefers-color-scheme:dark)");
if(S.theme)root.dataset.theme=S.theme;
const isDark=()=>root.dataset.theme?root.dataset.theme=="dark":dm.matches;
function lbl(){$("theme").textContent=isDark()?t("light"):t("dark")}
function hero(R){const C=364.4,off=C*(1-R.pct/100);$("done").textContent=R.h;$("left").textContent=R.left;
 const set=(g,p)=>{$("gpa").textContent=g.toFixed(2);$("pct").textContent=p.toFixed(2)+"%"};
 if(reduce){set(R.gpa,R.pct);$("arc").style.strokeDashoffset=off;prev={g:R.gpa,p:R.pct};return}
 const o={...prev};gsap.killTweensOf(o);gsap.to(o,{g:R.gpa,p:R.pct,duration:first?2.2:.9,ease:"power3.out",onUpdate:()=>set(o.g,o.p)});
 gsap.to("#arc",{strokeDashoffset:off,duration:first?2.4:1,ease:"power3.out"});
 prev={g:R.gpa,p:R.pct};first=false}
function chips(){const list=[{id:"all",l:t("all")},{id:"ip",l:t("ip")}];
 S.terms.forEach((tm,i)=>{list.push({id:tm.id,l:tn(tm,i)})});
 $("chips").innerHTML=list.map(c=>`<button class="chip ${filter==c.id?"on":""}" data-f="${c.id}">${esc(c.l)}</button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>filterTerm(b.dataset.f))}
function filterTerm(id){filter=id;chips();renderList()}

function renderList(){
  const f=filter;let html="";
  S.terms.forEach((tm,i)=>{
    const courses=tm.courses.filter(c=>{if(f=="all")return true;if(f=="ip")return c.status=="ip";return tm.id==f});
    if(f!="all"&&f!="ip"&&tm.id!=f)return;
    const tg=termGpa(tm),tDone=tm.courses.filter(c=>c.status=="done").length,tIp=tm.courses.filter(c=>c.status=="ip").length;
    let badgeText="",badgeColor="--mute";
    if(tDone==tm.courses.length&&tm.courses.length>0){badgeText=t("pDone");badgeColor="--gA"}
    else if(tIp==tm.courses.length&&tm.courses.length>0){badgeText=t("pIp");badgeColor="--gIP"}
    else if(tDone>0){badgeText=t("pMix");badgeColor="--gBp"}
    else{badgeText=t("pEmpty");badgeColor="--mute"}
    
    html+=`<div class="sem" data-id="${tm.id}"><div class="sem-h"><h2>${esc(tn(tm,i))} <span class="pill" style="--p:var(${badgeColor})">${badgeText}</span></h2>
    <div class="acts"><span class="s">${tg!=null?t("semGpa")+": <b>"+tg.toFixed(2)+"</b>":""}</span>
    <button class="btn sm glass" onclick="openTerm('${tm.id}')">${t("ren")}</button>
    <button class="btn sm glass" onclick="addCourse('${tm.id}')">${t("addC")}</button></div></div>`;
    
    if(courses.length==0){html+=`<div class="empty glass">${t("noC")}</div></div>`;return}
    html+=`<div class="grid">`;
    courses.forEach(c=>{
      const col=c.status=="done"?gcol(c):"--gIP";
      html+=`<div class="card glass" style="--c:var(${col})" onclick="openCourse('${tm.id}','${c.id}')">
      <div class="card-t"><div><h3>${esc(c.code)}</h3><div class="cn">${esc(nm(c))}</div></div>
      <div class="badge" style="--c:var(${col})">${c.status=="done"?c.grade:t("ip")}</div></div>`;
      if(c.status=="done"){
        const pct=c.total||0;
        html+=`<div class="meta"><span>${t("p.tot")}</span><b>${pct.toFixed(1)}%</b></div><div class="track"><div class="fill" style="width:${pct}%;--c:var(${col})"></div></div>`;
      }else{
        html+=`<div class="wait-t">⏳ ${t("wait")}</div>`;
      }
      html+=`</div>`;
    });
    html+=`</div></div>`;
  });
  if(!html)html=`<div class="empty glass">${t("noF")}</div>`;
  $("list").innerHTML=html;
}

function render(){statics();hero(calc());chips();renderList()}
function openModal(html){$("mb").innerHTML=html;$("ov").style.display="flex";$("ov").setAttribute("aria-hidden","false")}
function closeModal(){$("ov").style.display="none";$("ov").setAttribute("aria-hidden","true");curM=null}
$("x").onclick=closeModal;$("ov").onclick=e=>{if(e.target==$("ov"))closeModal()}

function openProfile(){
  curM="profile";
  const P=S.profile,pk=o=>o[lang]||o.ar;
  openModal(`<h2>${esc(t("profile"))}</h2>
  <div class="f"><label>${esc(t("name"))}</label><input id="p_n" class="in" value="${esc(pk(P.name))}">
  <label>${esc(t("major"))}</label><input id="p_m" class="in" value="${esc(pk(P.major))}">
  <label>${esc(t("college"))}</label><input id="p_c" class="in" value="${esc(pk(P.college))}">
  <div class="two"><div><label>${esc(t("scale"))}</label><select id="p_s" class="in"><option value="4"${P.scale==4?" selected":""}>4.0</option><option value="5"${P.scale==5?" selected":""}>5.0</option></select></div>
  <div><label>${esc(t("plan"))}</label><input id="p_pl" type="number" class="in" value="${P.plan}"></div></div></div>
  <div class="btns"><button class="btn pri" onclick="saveProfile()">${esc(t("save"))}</button><button class="btn glass" onclick="closeModal()">${esc(t("cancel"))}</button></div>`);
}
function saveProfile(){
  const n=$("p_n").value.trim(),m=$("p_m").value.trim(),c=$("p_c").value.trim(),sc=parseInt($("p_s").value),pl=parseInt($("p_pl").value);
  if(!n||!pl)return;
  S.profile.name[lang]=n;S.profile.major[lang]=m;S.profile.college[lang]=c;S.profile.scale=sc;S.profile.plan=pl;
  save();render();closeModal();
}
$("editBtn").onclick=openProfile;

function openTerm(id){
  const tm=S.terms.find(x=>x.id==id);if(!tm)return;
  curM="term:"+id;
  openModal(`<h2>${esc(t("ren"))}</h2>
  <div class="f"><label>${esc(t("termName"))}</label><input id="tm_n" class="in" value="${esc(tm.name||"")}"></div>
  <div class="btns"><button class="btn pri" onclick="saveTerm('${id}')">${esc(t("save"))}</button><button class="btn dan" onclick="delTerm('${id}')">${esc(t("del"))}</button><button class="btn glass" onclick="closeModal()">${esc(t("cancel"))}</button></div>`);
}
function saveTerm(id){const tm=S.terms.find(x=>x.id==id);if(!tm)return;tm.name=$("p_n")?$("p_n").value.trim():$("tm_n").value.trim();save();render();closeModal()}
function delTerm(id){if(confirm(t("delQ"))){S.terms=S.terms.filter(x=>x.id!=id);save();render();closeModal()}}

function openCourse(tid,cid){
  const tm=S.terms.find(x=>x.id==tid),c=tm?.courses.find(x=>x.id==cid);if(!c)return;
  curM="course:"+tid+":"+cid;
  const isDone=c.status=="done";
  let h=`<h2>${esc(c.code)} - ${esc(nm(c))}</h2><div class="f">
  <div class="two"><div><label>${esc(t("code"))}</label><input id="c_cd" class="in" value="${esc(c.code)}"></div>
  <div><label>${esc(t("cr"))}</label><input id="c_cr" type="number" class="in" value="${c.cr}"></div></div>
  <label>${esc(t("nAr"))}</label><input id="c_ar" class="in" value="${esc(c.ar||"")}">
  <label>${esc(t("nEn"))}</label><input id="c_en" class="in" value="${esc(c.en||"")}">
  <label>${esc(t("status"))}</label><select id="c_st" class="in" onchange="toggleSt(this.value)"><option value="done"${isDone?" selected":""}>${esc(t("stDone"))}</option><option value="ip"${!isDone?" selected":""}>${esc(t("stIp"))}</option></select>
  <div id="box_done" style="display:${isDone?"block":"none"}">
    <label>${esc(t("parts"))}</label>`;
  KEYS.forEach(k=>{
    const v=c.parts?.[k]?.[0]||0,mx=MAX[k];
    h+=`<div class="pr"><span>${t("p."+k)} (${mx})</span><input id="pr_${k}" type="number" step="any" class="in" value="${v}" oninput="calcTot()"></div>`;
  });
  h+=`<label>${esc(t("total"))}</label><input id="c_tot" class="in" readonly style="font-weight:700">
  <label>${esc(t("grade"))}</label><input id="c_gr" class="in" readonly style="font-weight:700"></div>
  <div id="box_ip" style="display:${!isDone?"block":"none"}"><div class="warn">ℹ️ ${esc(t("warn"))}</div></div></div>
  <div class="err" id="c_err"></div>
  <div class="btns"><button class="btn pri" onclick="saveCourse('${tid}','${cid}')">${esc(t("save"))}</button><button class="btn dan" onclick="delCourse('${tid}','${cid}')">${esc(t("del"))}</button><button class="btn glass" onclick="closeModal()">${esc(t("cancel"))}</button></div>`;
  openModal(h);if(isDone)calcTot();
}
function toggleSt(v){$("box_done").style.display=v=="done"?"block":"none";$("box_ip").style.display=v=="ip"?"block":"none"}
function calcTot(){
  let tot=0;KEYS.forEach(k=>{tot+=parseFloat($("pr_"+k)?.value||0)});
  const g=gradeOf(tot,S.profile.scale);
  if($("c_tot"))$("c_tot").value=tot.toFixed(1)+" / 100";
  if($("c_gr"))$("c_gr").value=g;
}
function addCourse(tid){
  const tm=S.terms.find(x=>x.id==tid);if(!tm)return;
  const newC={id:uid(),code:"NEW101",ar:"مقرر جديد",en:"New Course",cr:3,status:"ip",parts:null};
  tm.courses.push(newC);save();render();openCourse(tid,newC.id);
}
function saveCourse(tid,cid){
  const tm=S.terms.find(x=>x.id==tid),c=tm?.courses.find(x=>x.id==cid);if(!c)return;
  const cd=$("c_cd").value.trim(),ar=$("c_ar").value.trim(),en=$("c_en").value.trim(),cr=parseInt($("c_cr").value),st=$("c_st").value;
  if(!cd||!ar||!cr){$("c_err").textContent=t("eReq");return}
  c.code=cd;c.ar=ar;c.en=en;c.cr=cr;c.status=st;
  if(st=="done"){
    c.parts={};let tot=0;
    KEYS.forEach(k=>{const v=parseFloat($("pr_"+k).value||0);c.parts[k]=[v,MAX[k]];tot+=v});
    c.total=tot;c.grade=gradeOf(tot,S.profile.scale);
  }else{c.parts=null;c.total=null;c.grade=null}
  save();render();closeModal();
}
function delCourse(tid,cid){
  const tm=S.terms.find(x=>x.id==tid);if(!tm)return;
  tm.courses=tm.courses.filter(x=>x.id!=cid);save();render();closeModal();
}

$("rstBtn").onclick=()=>{
  openModal(`<h2>${esc(t("rst"))}</h2><p>${esc(t("rstQ"))}</p>
  <div class="btns"><button class="btn pri" onclick="resetData(true)">${esc(t("sample"))}</button><button class="btn dan" onclick="resetData(false)">${esc(t("clear"))}</button><button class="btn glass" onclick="closeModal()">${esc(t("cancel"))}</button></div>`);
};
function resetData(isSample){
  localStorage.removeItem(KEY);
  S=sample();first=true;render();closeModal();
}

$("lang").onclick=()=>{lang=lang=="ar"?"en":"ar";S.lang=lang;save();render();statics()};
$("theme").onclick=()=>{
  const d=isDark();root.dataset.theme=d?"light":"dark";S.theme=root.dataset.theme;save();lbl();
};

window.onload=()=>{
  statics();render();
  lenis=new Lenis({duration:1.2,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
  function raf(t){lenis.raf(t);requestAnimationFrame(raf)}
  requestAnimationFrame(raf);
};
</script>
</body>
</html>
